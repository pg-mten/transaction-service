name: Deploy transaction Service

on:
  push:
    branches:
      - release/development

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy with Rollback
        run: |
          ssh -i ~/.ssh/id_ed25519 \
          ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} << 'EOF'
            set -e

            cd ${{ secrets.DEPLOY_PATH }}

            echo "📦 Backup old image"
            docker tag transaction-service:latest transaction-service:rollback || true

            echo "⬇️ Pull code"
            cd transaction-service
            git checkout release/development
            git pull origin release/development
            cd ..

            echo "🚀 Deploy transaction"
            docker compose build transaction
            docker compose up -d transaction

            echo "⏳ Health check"
            sleep 15

            if [ "$(docker inspect --format='{{.State.Health.Status}}' transaction-service)" != "healthy" ]; then
              echo "❌ Transaction failed, rolling back"
              docker compose stop transaction
              docker rm transaction-service
              docker tag transaction-service:rollback transaction-service:latest
              docker compose up -d transaction
              exit 1
            fi

            echo "✅ Transaction deployed successfully"
          EOF
